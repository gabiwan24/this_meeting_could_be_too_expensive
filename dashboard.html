<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Cost Tracker – KMS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span { color: #6366f1; }

    #last-update {
      font-size: 0.75rem;
      color: #64748b;
    }

    /* KPI Row */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .kpi {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px;
    }

    .kpi-label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .kpi-value { font-size: 2rem; font-weight: 700; line-height: 1; }
    .kpi-value.green  { color: #22c55e; }
    .kpi-value.yellow { color: #f59e0b; }
    .kpi-value.red    { color: #ef4444; }
    .kpi-value.blue   { color: #6366f1; }

    /* Section */
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 12px;
    }

    /* Meeting Cards */
    #running-section, #finished-section { margin-bottom: 40px; }

    .cards { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px 24px;
      transition: border-color 0.2s;
    }

    .card.running  { border-left: 3px solid #22c55e; }
    .card.finished { border-left: 3px solid #6366f1; }
    .card.warn-warning  { border-left: 3px solid #f59e0b; }
    .card.warn-critical { border-left: 3px solid #ef4444; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .card-title { font-size: 1rem; font-weight: 600; line-height: 1.3; }
    .card-meta  { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

    .card-cost {
      text-align: right;
      flex-shrink: 0;
    }

    .cost-value { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; }
    .cost-label { font-size: 0.7rem; color: #64748b; margin-top: 2px; }

    /* Badges */
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .badge-running  { background: #14532d; color: #4ade80; }
    .badge-finished { background: #1e1b4b; color: #a5b4fc; }
    .badge-ok       { background: #1e293b; color: #94a3b8; }
    .badge-info     { background: #0c4a6e; color: #7dd3fc; }
    .badge-warning  { background: #451a03; color: #fbbf24; }
    .badge-critical { background: #450a0a; color: #f87171; }

    /* Attendees */
    .attendees {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attendee {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.75rem;
    }

    .attendee.director { border-color: #f59e0b44; background: #1c150000; }
    .attendee.clevel   { border-color: #ef444444; background: #1c000000; }

    .attendee-name  { color: #cbd5e1; }
    .attendee-cost  { color: #64748b; }
    .attendee-level { font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; }

    .level-3 { background: #1e3a5f; color: #93c5fd; }
    .level-4 { background: #451a03; color: #fbbf24; }
    .level-5 { background: #450a0a; color: #fca5a5; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px;
      color: #475569;
      background: #1e2130;
      border-radius: 12px;
      border: 1px dashed #2d3148;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 8px; }

    /* Pulse dot */
    .pulse-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Error banner */
    #error-banner {
      display: none;
      background: #450a0a;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <header>
    <h1>Meeting Cost <span>Tracker</span></h1>
    <div id="last-update">Lade...</div>
  </header>

  <div id="error-banner"></div>

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi">
      <div class="kpi-label">Laufende Meetings</div>
      <div class="kpi-value green" id="kpi-running">–</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Kosten heute (final)</div>
      <div class="kpi-value blue" id="kpi-cost-today">–</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Meetings heute</div>
      <div class="kpi-value" id="kpi-meetings-today">–</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Director-Warnungen</div>
      <div class="kpi-value yellow" id="kpi-warnings">–</div>
    </div>
  </div>

  <!-- Running -->
  <div id="running-section">
    <div class="section-title"><span class="pulse-dot"></span>Laufende Meetings</div>
    <div class="cards" id="running-cards">
      <div class="empty"><div class="empty-icon">✓</div>Keine laufenden Meetings</div>
    </div>
  </div>

  <!-- Finished today -->
  <div id="finished-section">
    <div class="section-title">Abgeschlossene Meetings – heute</div>
    <div class="cards" id="finished-cards">
      <div class="empty"><div class="empty-icon">📋</div>Noch keine Daten</div>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURATION – hier deine Supabase-Zugangsdaten eintragen
    // ============================================================
    const SUPABASE_URL    = 'https://bhzbpkwzkdvxcsmttkqf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_XHipEnQfRttYiaCasdWZfg_2HdhskcI';
    const REFRESH_INTERVAL_MS = 60 * 1000; // alle 60 Sekunden neu laden
    // ============================================================

    const headers = {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    async function fetchData() {
      try {
        const today = new Date().toISOString().split('T')[0];

        // Alle heutigen Meetings + Attendances laden
        const [meetingsRes, attendancesRes] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/meeting_cost_summary?start_time=gte.${today}T00:00:00&order=start_time.desc`, { headers }),
          fetch(`${SUPABASE_URL}/rest/v1/attendances?select=*&meeting_id=in.(${encodeURIComponent('select id from meetings where start_time >= \'' + today + 'T00:00:00\'')})`, { headers })
        ]);

        // Einfacherer Ansatz: attendances separat holen
        const meetings = await meetingsRes.json();

        if (!Array.isArray(meetings)) throw new Error(JSON.stringify(meetings));

        // Attendances für heutige Meetings laden
        const meetingIds = meetings.map(m => m.id).join(',');
        let attendances = [];
        if (meetingIds.length > 0) {
          const attRes = await fetch(
            `${SUPABASE_URL}/rest/v1/attendances?meeting_id=in.(${meetingIds})&order=cost.desc`,
            { headers }
          );
          attendances = await attRes.json();
        }

        // Attendances zu Meetings zuordnen
        const attMap = {};
        for (const a of attendances) {
          if (!attMap[a.meeting_id]) attMap[a.meeting_id] = [];
          attMap[a.meeting_id].push(a);
        }

        renderDashboard(meetings, attMap);
        document.getElementById('last-update').textContent =
          'Zuletzt: ' + new Date().toLocaleTimeString('de-DE');
        document.getElementById('error-banner').style.display = 'none';

      } catch (err) {
        console.error(err);
        const banner = document.getElementById('error-banner');
        banner.style.display = 'block';
        banner.textContent = 'Fehler beim Laden: ' + err.message;
      }
    }

    function renderDashboard(meetings, attMap) {
      const running  = meetings.filter(m => m.status === 'running');
      const finished = meetings.filter(m => m.status === 'finished');

      // KPIs
      const totalCostToday = finished.reduce((s, m) => s + (m.total_cost_final || 0), 0);
      const warnings = meetings.filter(m => m.director_alert === 'warning' || m.director_alert === 'critical').length;

      document.getElementById('kpi-running').textContent       = running.length;
      document.getElementById('kpi-cost-today').textContent    = formatEuro(totalCostToday);
      document.getElementById('kpi-meetings-today').textContent = meetings.length;
      document.getElementById('kpi-warnings').textContent      = warnings;
      document.getElementById('kpi-warnings').className        = 'kpi-value ' + (warnings > 0 ? 'yellow' : 'green');

      // Cards
      renderCards('running-cards',  running,  attMap, true);
      renderCards('finished-cards', finished, attMap, false);
    }

    function renderCards(containerId, meetings, attMap, isRunning) {
      const container = document.getElementById(containerId);

      if (meetings.length === 0) {
        container.innerHTML = `<div class="empty">
          <div class="empty-icon">${isRunning ? '✓' : '📋'}</div>
          ${isRunning ? 'Keine laufenden Meetings' : 'Keine abgeschlossenen Meetings heute'}
        </div>`;
        return;
      }

      container.innerHTML = meetings.map(m => {
        const atts   = attMap[m.id] || [];
        const cost   = m.total_cost_final ?? m.total_cost_estimated ?? 0;
        const alert  = m.director_alert || 'ok';
        const cardClass = alert === 'ok' || alert === 'info'
          ? (isRunning ? 'running' : 'finished')
          : `warn-${alert}`;

        const start    = new Date(m.start_time);
        const end      = m.end_time ? new Date(m.end_time) : null;
        const duration = end ? Math.round((end - start) / 60000) : Math.round((Date.now() - start) / 60000);

        return `
        <div class="card ${cardClass}">
          <div class="card-header">
            <div>
              <div class="card-title">${escHtml(m.title || '(kein Betreff)')}</div>
              <div class="card-meta">
                ${start.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}
                ${end ? '– ' + end.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '(läuft)'}
                · ${duration} Min · ${m.attendee_count || 0} Teilnehmer
                · Org: ${escHtml(m.organizer || '–')}
              </div>
            </div>
            <div class="card-cost">
              <div class="cost-value">${formatEuro(cost)}</div>
              <div class="cost-label">${m.total_cost_final != null ? 'final' : 'geschätzt'}</div>
            </div>
          </div>

          <div class="badges">
            <span class="badge badge-${m.status === 'running' ? 'running' : 'finished'}">
              ${m.status === 'running' ? '● läuft' : '✓ fertig'}
            </span>
            ${m.director_count > 0 ? `
              <span class="badge badge-${alert}">
                ${alertIcon(alert)} ${m.director_count} Director${m.director_count > 1 ? 's' : ''}
                (${m.director_ratio_pct}%)
              </span>` : ''}
            ${m.cost_per_person ? `<span class="badge badge-ok">Ø ${formatEuro(m.cost_per_person)}/Person</span>` : ''}
          </div>

          ${atts.length > 0 ? `
          <div class="attendees">
            ${atts.map(a => attendeeChip(a)).join('')}
          </div>` : ''}
        </div>`;
      }).join('');
    }

    function attendeeChip(a) {
      const lvl = a.importance_level || 0;
      const cls = lvl >= 5 ? 'clevel' : lvl >= 4 ? 'director' : lvl >= 3 ? 'director' : '';
      const labelMap = { 3: 'Manager', 4: 'Direktor', 5: 'C-Level' };
      const label = labelMap[lvl] || '';
      const mins  = a.duration_minutes ? Math.round(a.duration_minutes) + ' Min' : '';

      return `<div class="attendee ${cls}">
        <span class="attendee-name">${escHtml(a.name || a.email)}</span>
        ${mins ? `<span class="attendee-cost">${mins}</span>` : ''}
        <span class="attendee-cost">${formatEuro(a.cost)}</span>
        ${label ? `<span class="attendee-level level-${lvl}">${label}</span>` : ''}
        ${a.is_estimated ? '<span class="attendee-cost">~</span>' : ''}
      </div>`;
    }

    function alertIcon(alert) {
      return { ok: '', info: 'ℹ', warning: '⚠', critical: '🔴' }[alert] || '';
    }

    function formatEuro(val) {
      if (val == null) return '–';
      return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(val);
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Initiales Laden + Interval
    fetchData();
    setInterval(fetchData, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
